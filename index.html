async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(E.salt), iterations: E.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(E.iv) }, key, b(E.ct));
  return new TextDecoder().decode(pt);
}
function show(html) { document.open(); document.write(html); document.close(); }
async function tryOpen(pw, remember) {
  const er = document.getElementById("er"), bt = document.getElementById("bt");
  bt.disabled = true; bt.textContent = "여는 중..."; er.textContent = "";
  try {
    const html = await unlock(pw);
    if (remember) { try { localStorage.setItem("20ma_pw", pw); } catch (e) {} }
    show(html);
  } catch (e) {
    try { localStorage.removeItem("20ma_pw"); } catch (x) {}

    bt.disabled = false; bt.textContent = "열기";
  }
}
